# Le site GitHub Pages est servi depuis la branche gh-pages : on la garde alignée sur main.
name: Synchroniser GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push --force origin HEAD:gh-pages
